name: Native builds

# Builds and tests Tranzl natively on each target. Real-model CPU checks download the
# ~5.1 GB pinned model and projector, so they run only on manual dispatch or when the
# pushed commit message contains [inference]. Hosted runners have no GPUs: these jobs
# validate CPU inference only, and hosted runners are not clean consumer machines.
on:
  push:
    branches: [codex/unified-inference-evaluation]
  workflow_dispatch:
    inputs:
      inference:
        description: Run the real-model CPU checks (downloads ~5.1 GB per target)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mac inference is validated locally with Metal; hosted Macs have no GPU access.
          - { name: macOS 15 ARM64, runner: macos-15, inference: false }
          - { name: Windows x64, runner: windows-2025, inference: true }
          - { name: Ubuntu 22.04 x64, runner: ubuntu-22.04, inference: true }
          - { name: Ubuntu 24.04 x64, runner: ubuntu-24.04, inference: true }
          - { name: Ubuntu 22.04 ARM64, runner: ubuntu-22.04-arm, inference: true }
          - { name: Ubuntu 24.04 ARM64, runner: ubuntu-24.04-arm, inference: true }
    defaults:
      run:
        shell: bash
    env:
      INFERENCE: ${{ matrix.inference && (github.event_name == 'workflow_dispatch' && inputs.inference || contains(github.event.head_commit.message, '[inference]')) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Record the environment
        run: |
          node -e "const os = require('os'); console.log(JSON.stringify({ platform: process.platform, arch: process.arch, release: os.release(), cpu: os.cpus()[0]?.model, cpus: os.cpus().length, ramGiB: +(os.totalmem() / 2 ** 30).toFixed(1), node: process.version }))"
          df -h . || true

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          pkgs=(xvfb libnss3 libgbm1 libxss1 libxkbcommon0 libdrm2 binutils)
          # Ubuntu 24.04 renamed some libraries (t64 transition); take whichever exists.
          for pair in libgtk-3-0t64:libgtk-3-0 libasound2t64:libasound2; do
            if apt-cache show "${pair%%:*}" > /dev/null 2>&1; then pkgs+=("${pair%%:*}"); else pkgs+=("${pair##*:}"); fi
          done
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
          # Electron needs a display; xvfb-run's default screen is only 640x480.
          printf '#!/bin/sh\nexec xvfb-run -a -s "-screen 0 1920x1080x24" "$@"\n' > "$RUNNER_TEMP/with-display"
          chmod +x "$RUNNER_TEMP/with-display" && echo "XVFB=$RUNNER_TEMP/with-display" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Download Electron
        # Electron 44 has no install script; it downloads its binary on first use.
        run: node -e "console.log(require('electron'))"

      - name: Let Chromium's sandbox run (Linux)
        if: runner.os == 'Linux'
        # Tranzl is never run with --no-sandbox. Chromium sandboxes renderers with user
        # namespaces, which Ubuntu 24.04's AppArmor policy blocks by default; relax that
        # on this disposable runner. Installed builds need an AppArmor profile (Stage F).
        run: |
          ls node_modules/electron/dist
          if [ -f node_modules/electron/dist/chrome-sandbox ]; then
            sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          fi
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Unit tests
        run: npm test

      - name: Electron UI, attachment and shutdown tests
        run: $XVFB npm run test:electron

      - name: Package natively
        run: npm run pack

      - name: UI tests against the package
        run: |
          app=$(node -p "require('path').resolve('dist', 'Tranzl-' + process.platform + '-' + process.arch, process.platform === 'darwin' ? 'Tranzl.app/Contents/Resources/app' : 'resources/app')")
          TRANZL_APP_ROOT="$app" $XVFB npm run test:electron

      - name: Runtime library requirements (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/evidence"
          curl -fsSL "$(node -p "require('./src/backends/embeddedAssets').runtimeFor().url")" | tar -xz -C "$RUNNER_TEMP/runtime"
          cd "$RUNNER_TEMP"/runtime/*/
          { echo "== ldd llama-server"; ldd ./llama-server; echo "== highest GLIBC symbol version"; objdump -T ./llama-server ./*.so* | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1; } | tee "$RUNNER_TEMP/evidence/runtime-libraries.txt"
          ! grep -q 'not found' "$RUNNER_TEMP/evidence/runtime-libraries.txt"

      - name: Download the pinned model with Tranzl's verified downloader
        if: env.INFERENCE == 'true'
        run: |
          node -e "
            const { downloadModel } = require('./src/backends/embeddedAssets'); let last = 0;
            downloadModel({ dirPath: process.argv[1], onProgress(done, total) {
              if (Date.now() - last > 30000) { last = Date.now(); console.log(Math.round(done / 1048576) + ' / ' + Math.round(total / 1048576) + ' MB'); }
            } }).then(file => console.log('Verified', file));
          " "$RUNNER_TEMP/models"

      - name: Build the evaluation package
        if: env.INFERENCE == 'true'
        run: npm run pack:evaluation -- "$RUNNER_TEMP/eval"

      - name: Real-model CPU checks from the package, outside the checkout
        if: env.INFERENCE == 'true'
        run: |
          dir="$RUNNER_TEMP/eval/TranzlRuntimeEvaluation-$(node -p 'process.platform + "-" + process.arch')"
          if [ "$RUNNER_OS" = Windows ]; then exe="$dir/TranzlRuntimeEvaluation.exe"; else
            exe="$dir/TranzlRuntimeEvaluation"; if [ -f "$dir/chrome-sandbox" ]; then sudo chown root:root "$dir/chrome-sandbox"; sudo chmod 4755 "$dir/chrome-sandbox"; fi; fi
          mkdir -p "$RUNNER_TEMP/evidence" && cd "$RUNNER_TEMP"
          # The app downloads its pinned runtime and projector itself, as in production.
          $XVFB "$exe" --backend=embedded --model="$RUNNER_TEMP/models/hf_ggml-org_gemma-4-E4B-it.Q4_0.gguf" \
            --download-runtime --media --extended --audio="$GITHUB_WORKSPACE/tests/fixtures/speech.wav" \
            --request-timeout=900 --output="$RUNNER_TEMP/evidence/report.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.runner }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore
          retention-days: 30
