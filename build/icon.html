<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
</style>
</head>
<body>
<!-- macOS app icon: 824px rounded tile centered on a 1024px canvas -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cfa"/>
      <stop offset="1" stop-color="#8a5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="412" rx="186" fill="url(#shine)"/>

  <!-- Big T -->
  <g fill="#ffffff">
    <rect x="272" y="290" width="380" height="92" rx="30"/>
    <rect x="416" y="290" width="92" height="444" rx="30"/>
  </g>

  <!-- translation arrow: small "z" tail suggesting Tranzl + motion -->
  <g stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92">
    <path d="M 570 560 H 726 L 570 716 H 726"/>
  </g>
</svg>
</body>
</html>
